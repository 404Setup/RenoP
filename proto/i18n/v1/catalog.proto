syntax = "proto3";

package renop.i18n.v1;

// KeyIndex is shared by all languages in one application build.
message KeyIndex {
  string revision = 1;
  repeated string keys = 2;
}

// LocaleCatalog values follow KeyIndex order, avoiding repeated translation keys per language.
message LocaleCatalog {
  string locale = 1;
  string key_revision = 2;
  repeated string values = 3;
}
